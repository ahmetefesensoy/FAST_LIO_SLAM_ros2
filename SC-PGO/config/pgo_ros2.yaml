/**:
  ros__parameters:
    save_directory: /tmp/fast_lio_slam
    keyframe_meter_gap: 0.5
    keyframe_deg_gap: 10.0
    sc_dist_thres: 0.2
    sc_max_radius: 80.0
    mapviz_filter_size: 0.4
    cloud_topic: /cloud_registered_body
    odometry_topic: /Odometry
    gnss_odometry_topic: /odometry/gps
    rtk_heading_topic: /rtk/heading_pose
    optimized_odometry_topic: /aft_pgo_odom
    optimized_path_topic: /aft_pgo_path
    optimized_map_topic: /aft_pgo_map
    loop_scan_topic: /loop_scan_local
    loop_submap_topic: /loop_submap_local
    diagnostics_topic: /pgo/diagnostics
    use_gnss_position: true
    use_rtk_heading: true
    use_altitude_factor: false
    measurement_time_tolerance: 0.2
    gnss_mahalanobis_threshold: 9.21
    heading_mahalanobis_threshold: 9.0
    heading_is_north_clockwise: false
    antenna_yaw_offset: 0.0
    meridian_convergence: 0.0
    # GNSS antenna origin expressed in base_frame (metres).
    antenna_offset_x: 0.0
    antenna_offset_y: 0.0
    antenna_offset_z: 0.0
    initialize_from_absolute_measurements: true
    publish_map_to_odom: true
    map_frame: map
    odom_frame: odom
    base_frame: base_link
