name: SC-PGO CI

on:
  push:
    branches: [rtk-gnss-pgo]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: humble
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths SC-PGO --ignore-src --rosdistro humble -r -y
      - name: Build SC-PGO
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths SC-PGO --packages-select aloam_velodyne \
            --cmake-args -DBUILD_TESTING=ON
      - name: Test SC-PGO
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-select aloam_velodyne --event-handlers console_direct+
          colcon test-result --verbose
